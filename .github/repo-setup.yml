# repo-setup.yml — THIS repository's desired GitHub configuration (#196).
#
# `skills/setup-repo/scripts/repo-setup.sh` prefers this file over the kit's shipped
# `templates/repo-setup.yml` (see repo-setup.sh:103), so what follows governs
# phmatray/tagout and nothing else.
#
# WHY THIS FILE EXISTS RATHER THAN AN EDIT TO THE SHIPPED DEFAULT. The `area:` axis names code,
# and this repo's code is the kit itself — `area: merge-pr` and `area: implement-issue` are
# meaningful here and meaningless in a consumer's application. The shipped manifest therefore
# keeps its `area: <your-area>` placeholder on purpose; `tests/repo-setup/test.sh` asserts BOTH
# halves, so filling that placeholder in "to finish the job" goes red rather than silently
# exporting these names to everyone who applies the default unedited.
#
# The type, priority and effort labels below are copied verbatim from the shipped manifest — they
# ARE universal, and the copy is what keeps this repo's converged state readable in one file.

labels:
  # ---------------------------------------------------------------- type: what kind of work it is
  # GitHub's own defaults, listed so they read as converged rather than as drift. `create-issue`
  # derives the PR title's Conventional-Commits type from them (bug -> fix, enhancement -> feat).
  - name: "bug"
    color: "d73a4a"
    description: "Something isn't working"
  - name: "enhancement"
    color: "a2eeef"
    description: "New feature or request"
  - name: "documentation"
    color: "0075ca"
    description: "Improvements or additions to documentation"

  # ------------------------------------------------------- priority: which tier to pull from next
  # `create-issue` Step 7 applies exactly one of these.
  - name: "priority: high"
    color: "b60205"
    description: "Pull this before the other tiers"
  - name: "priority: medium"
    color: "d93f0b"
    description: "The default tier — worth doing, not urgent"
  - name: "priority: low"
    color: "fbca04"
    description: "Do it when the queue is otherwise empty"

  # ------------------------------------------------------------------- effort: how big the job is
  # The axis `auto-dev` sorts on ("small effort first, then medium"). Without it that ordering has
  # nothing to read and the fleet takes issues in whatever order GitHub returns them.
  #
  # DECLARATION ORDER IS THE TIER ORDER: skills/auto-dev/scripts/survey.sh ranks an issue's
  # effort: label by its position in this list (first = tier 1, smallest), not by parsing the
  # label text itself (#213) — so list these smallest-to-largest, and any tier past the 2nd holds.
  - name: "effort: small"
    color: "c2e0c6"
    description: "One task, one test cycle"
  - name: "effort: medium"
    color: "bfd4f2"
    description: "A handful of tasks inside one layer"
  - name: "effort: large"
    color: "5319e7"
    description: "Cross-layer or phased — expect several commits"

  # --------------------------------------------------------------- area: which part of this repo
  # The axis `auto-dev` reads to give each parallel worker a NON-overlapping area. These are
  # per-SKILL rather than per-directory because that is where this backlog actually clusters:
  # #187, #188, #184 and #185 are all skills/auto-dev/, and #191 and #171 are both
  # skills/merge-pr/ — a single `area: skills` would collapse six issues into one area and
  # isolate nothing. The directory each one covers is in its description, so the mapping travels
  # with the label instead of living only in #196.
  #
  # ⚠️ These must COVER the tree, not merely sample it: both issue forms mark the Area dropdown
  # `required: true`, so a path no area names is a path no issue can be filed against. Check with
  # `git ls-files | awk -F/ '{print $1}' | sort -u` before removing one — the first draft of this
  # list left docs/, reviews/, samples/, .claude/ and .claude-plugin/ with no option at all.
  - name: "area: auto-dev"
    color: "c5def5"
    description: "skills/auto-dev/ and commands/auto-dev-*.md — the fleet orchestrator"
  - name: "area: merge-pr"
    color: "c5def5"
    description: "skills/merge-pr/ — the CI gate, the correction loop and the squash-merge"
  - name: "area: implement-issue"
    color: "c5def5"
    description: "skills/implement-issue/ — the plan executor and its git guards"
  - name: "area: create-issue"
    color: "c5def5"
    description: "skills/create-issue/ and skills/triage-backlog/ — filing and pruning issues"
  - name: "area: migrate"
    color: "c5def5"
    description: "skills/migrate-legacy/, skills/review-followups/ and commands/migrate-*.md"
  - name: "area: repo-setup"
    color: "c5def5"
    description: "skills/setup-repo/, skills/profile-repo/ and .claude/skills/repo-profile.md"
  - name: "area: skills"
    color: "c5def5"
    description: "skills/_shared/, create-pr, debug-issue, deliver-issue, review-sessions, cross-skill conventions"
  - name: "area: scripts"
    color: "c5def5"
    description: "scripts/ — the structural gates the kit ships"
  - name: "area: tests"
    color: "c5def5"
    description: "tests/, evals/ and the frozen samples/ fixture"
  - name: "area: templates"
    color: "c5def5"
    description: "templates/ — the workflow, issue-form and manifest templates the kit emits"
  - name: "area: docs"
    color: "c5def5"
    description: "docs/, reviews/, README.md and ARCHITECTURE.md — the prose the kit ships"
  - name: "area: ci"
    color: "c5def5"
    # ⚠️ GitHub caps a label description at 100 characters and rejects a longer one with 422 — a
    # 130-character description was MEASURED here (#200) misreported as "check the token's scope",
    # naming the wrong cause. `parse-manifest.py` now refuses an over-long description locally
    # before it ever reaches `gh`, and a 422 that does reach `gh` echoes the field GitHub named.
    description: ".github/, hooks/, .claude-plugin/, plugins/ and the repo-root config files"

# Labels `--prune` must never delete, as shell globs. These are labels a TOOL owns: they look
# undeclared because no human declares them, and deleting them breaks the automation that reads
# them. Copied from the shipped manifest deliberately — a repo-local manifest REPLACES the default
# rather than extending it, so dropping these here would re-arm exactly the case `plan` found
# against this repository: one `apply --prune` removing release-please's housekeeping labels.
pruneKeep:
  - "autorelease: *"   # release-please's housekeeping — never applied by hand, never deleted
  - "dependencies"     # Renovate labels its own PRs with this

# Issue forms copied into .github/ISSUE_TEMPLATE/ when absent. Bare file names: they are resolved
# against templates/issue-forms/ in the kit. `apply` never overwrites an existing form, so the
# copies under .github/ISSUE_TEMPLATE/ are free to carry this repo's real Area options while the
# shipped originals keep the placeholder.
issueTemplates:
  - feature_request.yml
  - bug_report.yml

# Repository settings, applied with `gh api -X PATCH repos/{owner}/{repo}`. Needs an admin-scoped
# token; without one this surface is reported as refused and the run exits 3 with the label and
# template halves still applied.
settings:
  # On a repo without it, every merge run from an implement-issue worktree leaks the remote branch
  # permanently — see #185, which this setting is the cause of.
  delete_branch_on_merge: true
  # The kit's integration style is squash-only: a linear main whose every subject ends in (#N),
  # which is what release-please parses and what the PR-title gate assumes.
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  # The repository's public face (#400): what GitHub shows above the file list, and the site
  # docs/ publishes (#401). Converged here, never edited in the GitHub UI.
  description: "Tagout — the gate-verified issue → PR lifecycle for coding agents (create-issue, implement-issue, merge-pr, auto-dev), with a .NET migration add-on powered by RoselineMCP."
  homepage: "https://phmatray.github.io/tagout/"

# Topics (#400): how the repository is found. `apply` writes the union of these and whatever is
# live; only `--prune` drops one this list does not name.
topics:
  - claude-code
  - claude-code-plugin
  - agent-skills
  - ai-agents
  - dotnet
  - csharp
  - roslyn
  - legacy-migration
  - github-issues
  - developer-workflow
  - methodology
  - mcp

# The GitHub Pages site (#400, #401): docs/ on main, built natively by GitHub Pages with the
# just-the-docs remote theme docs/_config.yml names — the methodology guide as its home page.
pages:
  source:
    branch: main
    path: /docs
