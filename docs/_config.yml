# docs/ is the GitHub Pages site (source: main / /docs), built by Pages' native Jekyll with the
# site's own layouts under docs/_layouts (no remote theme since the redesign): navigation, the
# scheme toggle, mermaid and the copy buttons are the site's own, wired in docs/_includes and
# docs/assets/js/site.js. No build step: what is committed is what Pages builds.
title: Tagout
description: Tagout — the gate-verified issue → PR lifecycle for coding agents, with a .NET migration add-on.
url: https://phmatray.github.io
baseurl: /tagout
lang: en

plugins:
  - jekyll-relative-links
  - jekyll-seo-tag

# The ```mermaid fences the guide uses render through docs/_includes/scripts.html, which loads
# mermaid from jsDelivr at exactly this version, so a CDN update cannot change the diagrams.
mermaid:
  version: "10.9.0"

sass:
  sass_dir: _sass
  style: compressed

# What must not become a page: the superpowers specs/plans (working documents), the case-study
# inventories (JSON), the generated dashboard (HTML that stands on its own),
# and the kit backlog — a development document review-followups reads at run time
# (scripts/release-title-gate.sh's SHIPPED_ANYWAY), so it carries no site front matter.
#
# By PATH, never a bare glob: `"*.html"` here excluded the layouts — Jekyll 3's entry filter
# fnmatches without FNM_PATHNAME and the layout reader runs through it — so every page was
# published without a layout (measured 2026-09-02, the site's first build). The Pages guard in
# tests/skills/test.sh refuses a glob entry for that reason.
exclude:
  - superpowers/
  - backlog.md
  - case-studies/winrt-portfolio/inventory/
  - case-studies/winrt-portfolio/dashboard.html
  - Gemfile
  - Gemfile.lock

# Every page names its own title and nav_order in its front matter; a page without one drops out
# of the navigation silently, which is why tests/skills/test.sh refuses an untitled docs/ page.
# Layouts are assigned by path here, so a page never has to name one.
defaults:
  - scope:
      path: ""
    values:
      layout: doc
      image: /assets/og.png
  - scope:
      path: index.md
    values:
      layout: home
  - scope:
      path: adr
    values:
      layout: adr
  - scope:
      path: adr/README.md
    values:
      layout: doc
      children_list: false
  - scope:
      path: journal
    values:
      layout: journal
  - scope:
      path: journal/index.md
    values:
      layout: journal-index
