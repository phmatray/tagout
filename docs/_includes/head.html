<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
<!-- The scheme, applied before first paint. A stored choice wins; without one the stylesheet follows
     prefers-color-scheme on its own, so this runs only to restore a choice. Without JavaScript the
     media query still gives a dark system the dark tokens. Block comments only inside inline
     scripts (tests/skills/test.sh keeps that rule so a folded page can never swallow a script). -->
<script>
  (function () {
    var stored = null;
    try { stored = localStorage.getItem('kit-scheme'); } catch (e) { /* private mode: nothing stored */ }
    if (stored === 'dark' || stored === 'light') {
      document.documentElement.setAttribute('data-kit-scheme', stored);
    }
  })();
</script>
