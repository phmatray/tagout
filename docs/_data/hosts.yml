# The host table (#526): the one home of which hosts install the kit, how, and what each gets.
#
# Read by scripts/host-adapters.py check — every `adapter` exists, and every `install` line of a
# `tier: plugin` host appears verbatim in README.md — and rendered by the site: docs/install.md,
# docs/platforms.md and the home page's host picker. Add a host here, never in a page.
#
# tier       plugin — one command installs the kit from this repository; rules — a clone at
#            ~/.tagout plus a rule file the host reads, which routes to the skills there.
# adapter    the file in this repository that points the host at the kit's sources.
# gets       yes | partial | no, per capability: skills, commands (/migrate and its siblings),
#            mcp (the bundled RoselineMCP and AdrMcp), hooks (the gates in hooks/), subagents
#            (auto-dev and deliver-issue dispatch fresh-context workers).
# note       one sentence on what differs from Claude Code, shown under the host on the site.
# uninstall  the host's own removal command, where its documentation names one (#527).

- id: claude-code
  name: Claude Code
  tier: plugin
  adapter: plugins/tagout/.claude-plugin/plugin.json
  install:
    - claude plugin marketplace add phmatray/tagout
    - claude plugin install tagout@tagout-marketplace
    - claude plugin install tagout-migrate@tagout-marketplace
  then: Inside a session the same commands work as `/plugin marketplace add` and `/plugin install`.
  gets: {skills: "yes", commands: "yes", mcp: "yes", hooks: "yes", subagents: "yes"}
  note: The host the kit is written for — every gate, command and sub-agent dispatch is native here.
  uninstall: claude plugin uninstall tagout

- id: codex
  name: Codex
  tier: plugin
  adapter: .codex-plugin/plugin.json
  install:
    - codex plugin marketplace add phmatray/tagout
  then: Open `/plugins`, install Tagout, then review and trust its hooks in `/hooks`.
  gets: {skills: "yes", commands: "no", mcp: "yes", hooks: "partial", subagents: "partial"}
  note: Codex has no `Read` tool, so the roseline gate never fires; the git write-gate and the auto-dev Stop gate do. Skills are invoked by name, not as slash commands.

- id: copilot-cli
  name: GitHub Copilot CLI
  tier: plugin
  adapter: .github/plugin/plugin.json
  install:
    - copilot plugin marketplace add phmatray/tagout
    - copilot plugin install tagout@tagout-marketplace
  then: Skills are namespaced by the plugin — `/tagout:create-issue`, and so on.
  gets: {skills: "yes", commands: "no", mcp: "yes", hooks: "no", subagents: "partial"}
  note: Copilot's hook payloads differ from Claude Code's, so no gate is wired; the `/migrate…` commands reach `migrate-legacy` by name.
  uninstall: copilot plugin uninstall tagout

- id: gemini-cli
  name: Gemini CLI
  tier: plugin
  adapter: gemini-extension.json
  install:
    - gemini extensions install https://github.com/phmatray/tagout
  then: AGENTS.md loads as always-on context, and `/migrate` and its siblings arrive as commands.
  gets: {skills: "yes", commands: "yes", mcp: "yes", hooks: "no", subagents: "partial"}
  note: Gemini's hook events are its own, so no gate is wired; everything else installs as an extension.
  uninstall: gemini extensions uninstall tagout

- id: antigravity
  name: Antigravity CLI
  tier: plugin
  adapter: gemini-extension.json
  install:
    - agy plugin install https://github.com/phmatray/tagout
  then: It reuses the Gemini extension; type a command such as `/migrate-assess` as a message.
  gets: {skills: "yes", commands: "partial", mcp: "yes", hooks: "no", subagents: "partial"}
  note: Antigravity turns extension commands into skills you invoke from the chat.

- id: pi
  name: pi
  tier: plugin
  adapter: package.json
  install:
    - pi install git:github.com/phmatray/tagout
  then: The skills load as a pi package; the issue → pull request skills work as they are.
  gets: {skills: "yes", commands: "no", mcp: "no", hooks: "no", subagents: "no"}
  note: pi loads no MCP servers from a package, so the migration pipeline, which needs RoselineMCP, is out of reach there.
  uninstall: pi uninstall git:github.com/phmatray/tagout

- id: cursor
  name: Cursor
  tier: rules
  adapter: .cursor/rules/tagout.mdc
  install:
    - git clone https://github.com/phmatray/tagout ~/.tagout
    - mkdir -p .cursor/rules && cp ~/.tagout/.cursor/rules/tagout.mdc .cursor/rules/
  then: Register RoselineMCP and AdrMcp in Cursor's MCP settings for the migration pipeline.
  gets: {skills: "partial", commands: "no", mcp: "partial", hooks: "no", subagents: "no"}
  note: The always-applied rule routes each request to a skill in the clone, which the agent reads and follows.

- id: windsurf
  name: Windsurf
  tier: rules
  adapter: .windsurf/rules/tagout.md
  install:
    - git clone https://github.com/phmatray/tagout ~/.tagout
    - mkdir -p .windsurf/rules && cp ~/.tagout/.windsurf/rules/tagout.md .windsurf/rules/
  then: Register RoselineMCP and AdrMcp in Windsurf's MCP settings for the migration pipeline.
  gets: {skills: "partial", commands: "no", mcp: "partial", hooks: "no", subagents: "no"}
  note: An always-on rule, routing to the skills in the clone.

- id: cline
  name: Cline
  tier: rules
  adapter: .clinerules/tagout.md
  install:
    - git clone https://github.com/phmatray/tagout ~/.tagout
    - mkdir -p .clinerules && cp ~/.tagout/.clinerules/tagout.md .clinerules/
  then: Register RoselineMCP and AdrMcp in Cline's MCP settings for the migration pipeline.
  gets: {skills: "partial", commands: "no", mcp: "partial", hooks: "no", subagents: "no"}
  note: A project rule, routing to the skills in the clone.

- id: kiro
  name: Kiro
  tier: rules
  adapter: .kiro/steering/tagout.md
  install:
    - git clone https://github.com/phmatray/tagout ~/.tagout
    - mkdir -p .kiro/steering && cp ~/.tagout/.kiro/steering/tagout.md .kiro/steering/
  then: Copy it to `~/.kiro/steering/` instead to load it in every project.
  gets: {skills: "partial", commands: "no", mcp: "partial", hooks: "no", subagents: "no"}
  note: A steering file included in every conversation, routing to the skills in the clone.

- id: github-copilot
  name: GitHub Copilot in the editor
  tier: rules
  adapter: .github/copilot-instructions.md
  install:
    - git clone https://github.com/phmatray/tagout ~/.tagout
    - mkdir -p .github && cat ~/.tagout/.github/copilot-instructions.md >> .github/copilot-instructions.md
  then: Appending keeps any instructions your repository already has.
  gets: {skills: "partial", commands: "no", mcp: "partial", hooks: "no", subagents: "no"}
  note: Repository instructions for Copilot Chat in VS Code, JetBrains and Visual Studio; the Copilot CLI installs as a plugin instead.

- id: agents-md
  name: Zed, Amp, Jules, Junie, OpenCode
  tier: rules
  adapter: AGENTS.md
  install:
    - git clone https://github.com/phmatray/tagout ~/.tagout
    - cat ~/.tagout/AGENTS.md >> AGENTS.md
  then: Each of these reads an `AGENTS.md` at the project root; appending keeps yours.
  gets: {skills: "partial", commands: "no", mcp: "partial", hooks: "no", subagents: "no"}
  note: The same routing text, read from your project's own AGENTS.md.
